project:
  name: credit-risk-analytics
  random_seed: 42

paths:
  raw_data: data/raw/loan_data_2007_2014.csv
  processed_data: data/processed/model_ready_loans.csv
  model_pipeline: models/logistic_regression_pipeline.joblib
  feature_metadata: models/feature_metadata.json
  metrics: reports/model_metrics/model_metrics.json
  figures: reports/figures
  powerbi_exports: data/powerbi_exports

model:
  test_size: 0.2
  class_weight: balanced
  max_iter: 1000
  risk_thresholds:
    low_max: 0.10
    medium_max: 0.25

features:
  candidate_predictors:
    - loan_amnt
    - annual_inc
    - dti
    - int_rate
    - installment
    - emp_length
    - grade
    - purpose
    - home_ownership
    - verification_status
    - term
